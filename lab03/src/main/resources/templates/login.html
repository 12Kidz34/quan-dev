<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }
        .login-box {
            width: 350px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: steelblue;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: dodgerblue;
        }
        .msg {
            text-align: center;
            color: #e91e63;
            margin-bottom: 10px;
        }
        .remember {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Đăng nhập hệ thống</h2>
    <p class="msg" th:text="${message}"></p>

    <form th:action="@{/login/check}" method="post">
        <input type="text" name="username" placeholder="Email" required />
        <input type="password" name="password" placeholder="Mật khẩu" required />

        <!-- ✅ Remember Me -->
        <div class="remember">
            <input type="checkbox" name="remember-me" id="remember-me" />
            <label for="remember-me">Ghi nhớ đăng nhập</label>
        </div>

        <button type="submit">Đăng nhập</button>
        <!-- đoạn cần bổ sung -->
        <a href="/oauth2/authorization/google">Đăng nhập bằng Google</a>

    </form>

    <p style="text-align:center;margin-top:10px;">
        <a th:href="@{/}">← Quay về trang chủ</a>
    </p>
</div>
</body>
</html>
