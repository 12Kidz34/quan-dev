<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>RESTful Web API</title>
</head>
<body>
<h3>RESTful Web API</h3>
<hr>

<button onclick="doGetAll()">Get All</button>
<button onclick="doGetByKey()">Get By Key</button>
<button onclick="doPost()">Post</button>
<button onclick="doPut()">Put</button>
<button onclick="doDelete()">Delete</button>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
    const host = "https://java06-78626-default-rtdb.asia-southeast1.firebasedatabase.app";


    function doGetAll() {
        var url = `${host}/student.json`;
        axios.get(url).then(resp => {
            console.log("Success", resp.data);
        }).catch(err => {
            console.log("Error", err);
        });
    }

    function doGetByKey() {
        var key = prompt("Nhập key cần tìm (vd: -O5B4...):");
        var url = `${host}/student/${key}.json`;

        axios.get(url).then(resp => {
            console.log("Success", resp.data);
        }).catch(err => {
            console.log("Error", err);
        });
    }

    function doPost() {
        var url = `${host}/student.json`;
        var data = {
            id: "SV99",
            name: "Sinh viên 99",
            mark: 4.5,
            gender: true
        };

        axios.post(url, data).then(resp => {
            console.log("Success", resp.data);
        }).catch(err => {
            console.log("Error", err);
        });
    }

    function doPut() {
        var key = prompt("Nhập key cần update:");
        var url = `${host}/student/${key}.json`;

        var data = {
            id: "SV00",
            name: "Sinh viên 00",
            mark: 8.5,
            gender: true
        };

        axios.put(url, data).then(resp => {
            console.log("Success", resp.data);
        }).catch(err => {
            console.log("Error", err);
        });
    }

    function doDelete() {
        var key = prompt("Nhập key cần xóa:");
        var url = `${host}/student/${key}.json`;

        axios.delete(url).then(resp => {
            console.log("Success", resp.data);
        }).catch(err => {
            console.log("Error", err);
        });
    }
</script>
</body>
</html>
